[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "funasr>=1.3.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.22",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "uvicorn>=0.42.0",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[project.optional-dependencies]
desktop = [
    "pynput>=1.7.7",
    "sounddevice>=0.5.2",
    "scipy>=1.14.0",
    "pyperclip>=1.9.0",
]
