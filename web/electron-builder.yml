appId: com.phonetics-2.app
productName: Phonetics-2
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
extraResources:
  - from: ../api/dist/sidecar
    to: sidecar
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Phonetics-2
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.productivity
